# Higher resolution at the camera's supported raw YUYV rate; avoids MJPEG input.
[Service]
ExecStart=
ExecStart=/bin/bash /home/pi/talos-vision-integration-20261001/stream_camera.sh
Environment=VIDEO_SIZE=1280x720
Environment=VIDEO_FPS=10
Environment=INPUT_FORMAT=yuyv422
Environment=VIDEO_ENCODER=h264_v4l2m2m
Environment=VIDEO_BITRATE=3M
